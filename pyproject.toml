[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lith"
version = "0.1.0"
description = "Repeatable pipeline for producing tech and AI announcement graphics through seven style families."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["image-generation", "social-media", "design", "branding"]
authors = [
    {name = "funsaized"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "coverage>=7.0",
]

[project.scripts]
lith-generate = "lith.cli.generate:main"
lith-run = "lith.cli.run:main"
lith-call = "lith.cli.call:main"

[project.urls]
Repository = "https://github.com/funsaized/lith"
Issues = "https://github.com/funsaized/lith/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lith" = ["data/styles.json"]
